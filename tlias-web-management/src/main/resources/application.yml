
spring:
  application:
    name: tlias-web-management
  #配置数据库的连接信息
  datasource:
    url: jdbc:mysql://localhost:3306/tlias?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
#mybatis的相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    开启了驼峰命名映射的开关 输入camel（骆驼->驼峰命名）会有提示
    map-underscore-to-camel-case: true

#配置事务管理日志级别
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

#文件上传配置
upload:
  type: local  # local:本地存储, oss:阿里云OSS存储

#阿里云OSS配置
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com  # OSS访问端点，根据实际区域修改
    bucketName: heima-java-web-ai-2026  # 替换为你的Bucket名称
    region: cn-beijing  # Bucket所在区域